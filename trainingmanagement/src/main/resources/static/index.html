<!DOCTYPE html>
<html>
<head>
    <title>Training Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            cursor: pointer;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<h2>Government Training Management System</h2>

<label>Training Program ID</label>
<input type="number" id="trainingProgramId">

<label>Officer ID</label>
<input type="number" id="officerId">

<label>Department ID</label>
<input type="number" id="departmentId">

<button onclick="submitNomination()">Add Nomination</button>

<p id="message"></p>

<script>
async function submitNomination() {

    const data = {
        trainingProgramId: Number(document.getElementById("trainingProgramId").value),
        officerId: Number(document.getElementById("officerId").value),
        departmentId: Number(document.getElementById("departmentId").value)
    };

    const response = await fetch("/nominations", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
    });

    const result = await response.text();

    const message = document.getElementById("message");

    if (response.ok) {
        message.innerText = "Nomination added successfully";
    } else {
        message.innerText = result;
    }
}
</script>

</body>
</html>
